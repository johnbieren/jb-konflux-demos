---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: 2136-rpa
  namespace: release-2136-managed
  labels:
    release.appstudio.openshift.io/block-releases: 'true'
spec:
  applications:
    - app
  origin: release-2136-dev
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/johnbieren/jb-konflux-demos.git"
        - name: revision
          value: main
        - name: pathInRepo
          value: "release_2136/managed-dummy.yaml"
    serviceAccountName: release-service-account
  policy: mvp-policy
