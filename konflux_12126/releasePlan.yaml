---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlan
metadata:
  labels:
    release.appstudio.openshift.io/author: kube_admin
    release.appstudio.openshift.io/auto-release: "true"
    release.appstudio.openshift.io/standing-attribution: "true"
  name: rp
  namespace: release-dev
spec:
  application: app
  releaseGracePeriodDays: 7
  finalPipeline:
    serviceAccountName: dev-service-account
    pipelineRef:
      params:
      - name: url
        value: https://github.com/johnbieren/jb-konflux-demos.git
      - name: revision
        value: main
      - name: pathInRepo
        value: "dummy-pipeline/pipeline.yaml"
      resolver: git
  target: release-managed
