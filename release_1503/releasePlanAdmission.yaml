---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: 1503-rpa
  namespace: release-1503-managed
spec:
  applications:
    - app
  origin: release-1503-dev
  pipeline:
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/johnbieren/jb-konflux-demos.git"
        - name: revision
          value: main
        - name: pathInRepo
          value: "release_1503/managed-dummy.yaml"
    serviceAccountName: release-service-account
  policy: mvp-policy
